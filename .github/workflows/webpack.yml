name: CI

on:
  push:
    branches: ["master-dev"]
  pull_request:
    branches: ["master-dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-design-tools-${{ github.ref }}-${{ matrix.node-version }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Token-mapping tests
        run: npm test

      - name: Vite build
        run: npm run build
