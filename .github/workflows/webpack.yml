name: CI

on:
  push:
    branches: ["master-dev"]
  pull_request:
    branches: ["master-dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-design-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require source provenance
        run: test -s docs/SOURCE_PROVENANCE.md

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- ':!package-lock.json' ':!**/package-lock.json' ':!*.min.js'; then
            echo 'Unresolved Git conflict markers found.' >&2
            exit 1
          fi

      - name: Test and build
        run: npm run check
